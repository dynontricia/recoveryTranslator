<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recovery Translator for Zoom</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 16px; color: #1a202c; background: #f7fafc;
            display: flex; flex-direction: column; gap: 12px;
        }
        h1 { font-size: 17px; }
        .status { padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
        .status.ok { background: #f0fff4; border: 1px solid #9ae6b4; color: #22543d; }
        .status.err { background: #fff5f5; border: 1px solid #fc8181; color: #742a2a; }
        .status.pending { background: #ebf8ff; border: 1px solid #90cdf4; color: #2c5282; }
        .row { display: flex; gap: 8px; }
        button {
            flex: 1; padding: 10px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .btn-start { background: #38a169; color: #fff; }
        .btn-stop { background: #e53e3e; color: #fff; }
        .toggle button { background: #e2e8f0; color: #1a202c; font-weight: 500; }
        .toggle button.on { background: #4f46e5; color: #fff; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        #captions { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
        .cap-label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #718096; }
        .cap-box {
            flex: 1; min-height: 80px; overflow-y: auto; background: #fff;
            border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 10px 12px;
            font-size: 17px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word;
        }
        #cap-es-wrap .cap-box { background: #e6fffa; border-color: #b2f5ea; }
        .cap-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
        details { font-size: 11px; color: #718096; }
        pre {
            margin-top: 6px; background: #1a202c; color: #68d391; font-size: 11px; padding: 8px;
            border-radius: 6px; max-height: 120px; overflow: auto; white-space: pre-wrap; word-break: break-word;
        }
    </style>
</head>
<body>
<h1>Recovery Translator</h1>
<div class="status pending" id="status">Loading…</div>

<div class="row" id="controls" style="display:none">
    <button class="btn-start" id="start-btn" onclick="startCaptions()">Start captions</button>
    <button class="btn-stop" id="stop-btn" onclick="stopCaptions()" disabled>Stop captions</button>
</div>

<div class="row toggle" id="display-toggle" style="display:none">
    <button id="show-en" class="on" onclick="setDisplay('english')">English</button>
    <button id="show-both" onclick="setDisplay('both')">English + Español</button>
</div>

<div id="captions" style="display:none">
    <div class="cap-wrap" id="cap-en-wrap">
        <div class="cap-label">English</div>
        <div class="cap-box" id="cap-en"></div>
    </div>
    <div class="cap-wrap" id="cap-es-wrap" style="display:none">
        <div class="cap-label">Español</div>
        <div class="cap-box" id="cap-es"></div>
    </div>
</div>

<details>
    <summary>Details</summary>
    <pre id="log"></pre>
</details>

<script src="https://appssdk.zoom.us/sdk.js"></script>
<script>
    // The SDK defines window.zoomSdk globally -- don't redeclare it.
    const sdk = window.zoomSdk;
    let sessionCode = null, sessionMode = 'bilingual';
    let display = 'english';
    let enSource = null, esSource = null;
    let findTimer = null, audioTimer = null;

    function setStatus(cls, text) {
        const el = document.getElementById('status');
        el.className = 'status ' + cls;
        el.textContent = text;
    }
    function log(msg) {
        const el = document.getElementById('log');
        el.textContent += `${new Date().toLocaleTimeString()}  ${msg}\n`;
        el.scrollTop = el.scrollHeight;
    }

    async function init() {
        try {
            const cfg = await sdk.config({ capabilities: ['startRTMS', 'stopRTMS'], version: '0.16' });
            log('Connected to Zoom. Context: ' + cfg.runningContext);
        } catch (err) {
            log('sdk.config() failed: ' + err.message);
            setStatus('err', 'This page runs inside a Zoom meeting. Open it from Apps → Recovery Translator.');
            return;
        }
        findSession();
    }

    // Look for the session started with "A Zoom meeting" as its audio source.
    async function findSession() {
        try {
            const res = await fetch('/zoom/current-session');
            const data = await res.json();
            if (data.sessionCode) {
                clearTimeout(findTimer);
                showSession(data);
                return;
            }
        } catch (err) { log('Session lookup failed: ' + err.message); }
        setStatus('pending', `No session is waiting for Zoom audio. Go to ${location.origin}, start a session, ` +
            `and choose "A Zoom meeting" as the audio source. This panel will pick it up automatically.`);
        findTimer = setTimeout(findSession, 3000);
    }

    function showSession(data) {
        unsubscribe();
        sessionCode = data.sessionCode;
        sessionMode = data.mode;
        log(`Session ${sessionCode} (${sessionMode})`);
        document.getElementById('controls').style.display = '';
        document.getElementById('captions').style.display = '';
        // Spanish is only offered when the session produces it.
        const bilingual = sessionMode !== 'transcript_only';
        document.getElementById('display-toggle').style.display = bilingual ? '' : 'none';
        if (!bilingual) display = 'english';
        subscribe();
        if (data.audioConnected) {
            setCaptionsRunning(true);
        } else {
            setStatus('pending', `Session ${sessionCode} is ready. Tap Start captions.`);
        }
        watchAudio();
    }

    async function startCaptions() {
        document.getElementById('start-btn').disabled = true;
        try {
            // Tell the server this session wants Zoom's audio, then start it.
            const res = await fetch('/zoom/connect', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionCode })
            });
            const data = await res.json();
            log('Connect: ' + data.status);
            if (data.status === 'no-session') {
                setStatus('err', 'That session has ended. Start a new one.');
                sessionCode = null;
                findSession();
                return;
            }
            try {
                const r = await sdk.startRTMS();
                log('startRTMS: ' + JSON.stringify(r));
            } catch (err) {
                // With RTMS auto-start on, the stream may already be running.
                // The server already claimed it above, so this isn't fatal.
                log('startRTMS: ' + err.message);
            }
            setStatus('pending', 'Connecting to Zoom audio…');
        } catch (err) {
            log('Start failed: ' + err.message);
            setStatus('err', 'Could not start captions: ' + err.message);
            document.getElementById('start-btn').disabled = false;
        }
    }

    async function stopCaptions() {
        try {
            const r = await sdk.stopRTMS();
            log('stopRTMS: ' + JSON.stringify(r));
        } catch (err) {
            log('stopRTMS failed: ' + err.message);
        }
    }

    // Keeps the status and buttons in step with whether Zoom audio is flowing.
    function watchAudio() {
        clearInterval(audioTimer);
        const check = async () => {
            if (!sessionCode) return;
            try {
                const res = await fetch(`/zoom/session-status?code=${sessionCode}`);
                const data = await res.json();
                if (!data.exists) {
                    clearInterval(audioTimer);
                    setStatus('err', 'This session has ended.');
                    document.getElementById('controls').style.display = 'none';
                    unsubscribe();
                    sessionCode = null;
                    findSession();
                    return;
                }
                setCaptionsRunning(data.audioConnected);
            } catch (e) { /* keep trying */ }
        };
        audioTimer = setInterval(check, 2000);
    }

    function setCaptionsRunning(running) {
        document.getElementById('start-btn').disabled = running;
        document.getElementById('stop-btn').disabled = !running;
        if (running) setStatus('ok', `Captions are live · session ${sessionCode}`);
        else if (sessionCode) setStatus('pending', `Session ${sessionCode} is ready. Tap Start captions.`);
    }

    function setDisplay(mode) {
        display = mode;
        document.getElementById('show-en').classList.toggle('on', mode === 'english');
        document.getElementById('show-both').classList.toggle('on', mode === 'both');
        subscribe();
    }

    // Each box streams its language from the server -- the same feed the
    // display page and listeners use. English stays connected; the toggle
    // only adds or removes Spanish, so English on screen is never wiped.
    function subscribe() {
        if (!sessionCode) return;
        if (!enSource) enSource = attach('english', 'cap-en');
        const showEs = display === 'both' && sessionMode !== 'transcript_only';
        document.getElementById('cap-es-wrap').style.display = showEs ? '' : 'none';
        if (showEs && !esSource) esSource = attach('spanish', 'cap-es');
        if (!showEs && esSource) { esSource.close(); esSource = null; }
    }

    function unsubscribe() {
        if (enSource) { enSource.close(); enSource = null; }
        if (esSource) { esSource.close(); esSource = null; }
    }

    function attach(lang, boxId) {
        const box = document.getElementById(boxId);
        box.textContent = '';
        const src = new EventSource(`/stream/${sessionCode}/${lang}`);
        src.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.type === 'session_ended') { box.innerText += '\n\n[Session ended]'; src.close(); return; }
            if (!data.text) return;
            box.innerText += data.text;
            box.scrollTop = box.scrollHeight;
        };
        return src;
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
