<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recovery Translator for Zoom</title>
    <!-- Filled in by the server from Zoom's signed context: identifies this meeting. -->
    <meta name="rt-panel-token" content=""/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 16px; color: #1a202c; background: #f7fafc;
            display: flex; flex-direction: column; gap: 12px;
        }
        h1 { font-size: 15px; }
        .top { display: flex; align-items: center; gap: 8px; }
        .top .status { flex: 1; padding: 6px 10px; font-size: 12px; }
        details.controls { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 8px; }
        details.controls > summary {
            padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; list-style: none;
            display: flex; justify-content: space-between; align-items: center;
        }
        details.controls > summary::-webkit-details-marker { display: none; }
        details.controls > summary::after { content: '▸'; color: #718096; }
        details.controls[open] > summary::after { content: '▾'; }
        .controls-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
        .cap-head { display: flex; align-items: center; gap: 6px; }
        .cap-head .cap-label { flex: 1; }
        .size-btn {
            flex: 0 0 auto; padding: 2px 9px; font-size: 13px; font-weight: 700;
            background: #e2e8f0; color: #1a202c; border-radius: 6px;
        }
        h2 { font-size: 15px; }
        .status { padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
        .status.ok { background: #f0fff4; border: 1px solid #9ae6b4; color: #22543d; }
        .status.err { background: #fff5f5; border: 1px solid #fc8181; color: #742a2a; }
        .status.pending { background: #ebf8ff; border: 1px solid #90cdf4; color: #2c5282; }
        .row { display: flex; gap: 8px; }
        button {
            flex: 1; padding: 10px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .btn-primary { background: #4f46e5; color: #fff; }
        .btn-start { background: #38a169; color: #fff; }
        .btn-stop { background: #e2e8f0; color: #1a202c; }
        .btn-end { background: #e53e3e; color: #fff; }
        .toggle button { background: #e2e8f0; color: #1a202c; font-weight: 500; }
        .toggle button.on { background: #4f46e5; color: #fff; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        form { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; font-weight: 600; margin-top: 4px; }
        input, select {
            width: 100%; padding: 9px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 14px;
        }
        .hint { font-size: 12px; color: #718096; line-height: 1.4; }
        .banner {
            background: #fffaf0; border: 1px solid #f6ad55; border-radius: 8px; padding: 10px 12px;
            font-size: 13px; display: flex; align-items: center; gap: 10px;
        }
        .banner button { flex: 0 0 auto; padding: 6px 12px; font-size: 13px; }
        .join { font-size: 12px; color: #4a5568; word-break: break-all; }
        .top .settings-link {
            flex: 0 0 auto; padding: 4px 8px; font-size: 12px; font-weight: 600;
            background: none; color: #4f46e5; text-decoration: underline;
        }
        .new-code strong { font-size: 18px; letter-spacing: 2px; }
        /* Hover or tap the (i) for an explanation, so the panel stays uncluttered. */
        .label-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
        .label-row label { margin-top: 0; }
        .tip {
            position: relative; display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; border-radius: 50%; background: #e2e8f0; color: #4a5568;
            font-size: 11px; font-weight: 700; cursor: help; outline: none;
        }
        .tip::after {
            content: attr(data-tip); display: none; position: absolute; top: 22px; left: -8px; z-index: 10;
            width: 230px; padding: 8px 10px; border-radius: 6px; background: #1a202c; color: #fff;
            font-size: 12px; font-weight: 400; line-height: 1.45;
        }
        .tip:hover::after, .tip:focus::after { display: block; }
        #link-fields:not([hidden]) { display: flex; flex-direction: column; gap: 6px; }
        .text-link { background: none; border: none; padding: 0; color: #4f46e5; text-decoration: underline;
            font-size: 12px; font-weight: 500; cursor: pointer; flex: 0 0 auto; }
        #captions { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
        .cap-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
        .cap-label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #718096; }
        .cap-box {
            flex: 1; min-height: 80px; overflow-y: auto; background: #fff;
            border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 10px 12px;
            font-size: 17px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word;
        }
        .cap-wrap:nth-child(odd) .cap-box { background: #e6fffa; border-color: #b2f5ea; }
        .lang-picker { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border-radius: 8px; }
        .lang-picker th { text-align: left; font-weight: 600; color: #4a5568; padding: 4px 6px; border-bottom: 1px solid #e2e8f0; }
        .lang-picker th:not(:first-child), .lang-picker td:not(:first-child) { text-align: center; width: 64px; }
        .lang-picker td { padding: 5px 6px; border-bottom: 1px solid #f0f4f8; }
        .lang-picker input { width: 16px; height: 16px; padding: 0; }
        details { font-size: 11px; color: #718096; }
        pre {
            margin-top: 6px; background: #1a202c; color: #68d391; font-size: 11px; padding: 8px;
            border-radius: 6px; max-height: 120px; overflow: auto; white-space: pre-wrap; word-break: break-word;
        }
    </style>
</head>
<body>
<div class="top">
    <h1>Recovery Translator</h1>
    <div class="status pending" id="status">Loading…</div>
    <button class="settings-link" id="settings-btn" onclick="openSettings()" style="display:none">Settings</button>
</div>

<!-- Settings: save the group's own Gemini key -->
<section id="settings-view" style="display:none">
    <h2>Settings</h2>
    <p class="hint" id="settings-intro"></p>
    <form id="settings-form" onsubmit="event.preventDefault(); saveSettings();">
        <label for="group-label">Group name (optional)</label>
        <input id="group-label" maxlength="80" autocomplete="off"/>
        <label for="gemini-key">Gemini API key</label>
        <input type="password" id="gemini-key" autocomplete="off" placeholder="Paste your key"/>
        <!-- The details (billing, how it's stored) live in the docs, opened in the browser -->
        <button type="button" class="text-link" style="align-self:flex-start" onclick="openDocs('/docs#gemini-key')">How to get a key ↗</button>
        <button type="submit" class="btn-primary" id="save-settings-btn">Save key</button>
    </form>
    <div class="status ok new-code" id="new-code" style="display:none;margin-top:8px"></div>
    <div class="row" style="margin-top:8px">
        <button class="btn-stop" onclick="closeSettings()">Back</button>
        <button class="btn-end" id="remove-key-btn" onclick="removeSettings()" style="display:none">Remove saved key</button>
    </div>
</section>

<!-- A session was started in this meeting (e.g., by a co-host) while the form is open -->
<div class="banner" id="browser-session-banner" style="display:none">
    <span id="browser-session-text"></span>
    <button class="btn-primary" onclick="useBrowserSession()">Use it</button>
</div>

<!-- Start a session from inside Zoom -->
<form id="start-form" style="display:none" onsubmit="event.preventDefault(); createSessionFromZoom();">
    <h2>Start a session</h2>
    <p class="hint" id="key-note" style="display:none"></p>
    <div id="access-code-row" style="display:flex;flex-direction:column;gap:6px">
        <label for="access-code">Access code</label>
        <input type="password" id="access-code" autocomplete="off"/>
    </div>

    <div class="label-row">
        <label>Languages</label>
        <span class="tip" tabindex="0" aria-label="About languages"
              data-tip="Captions appear in each checked language, using this meeting's audio. Audio also reads that language aloud for listeners. Each language is one more live translation, so check only what your meeting needs.">i</span>
    </div>
    <div id="lang-picker"></div>
    <button type="submit" class="btn-primary" id="create-btn" style="margin-top:6px">Start session</button>
</form>

<!-- Link a session started in the browser to this meeting -->
<form id="link-form" style="display:none" onsubmit="event.preventDefault(); linkBrowserSession();">
    <button type="button" class="text-link" style="align-self:flex-start" onclick="$('link-fields').hidden = !$('link-fields').hidden">Started the session on the website?</button>
    <div id="link-fields" hidden>
        <label for="link-code">Zoom link code (from the leader screen)</label>
        <input type="text" id="link-code" maxlength="6" autocomplete="off" oninput="this.value = this.value.toUpperCase()"/>
        <button type="submit" class="btn-primary" id="link-btn">Link to this meeting</button>
    </div>
</form>

<!-- Running session -->
<details class="controls" id="session-view" style="display:none" open>
    <summary id="controls-summary">Session controls</summary>
    <div class="controls-body">
        <div class="join" id="join-info"></div>
        <button class="btn-primary" id="chat-link-btn" onclick="postLinkToChat()">Post join link to meeting chat</button>
        <div class="row">
            <button class="btn-start" id="start-btn" onclick="startCaptions()">Start captions</button>
            <button class="btn-stop" id="stop-btn" onclick="stopCaptions()" disabled>Pause</button>
            <button class="btn-end" onclick="endSessionFromZoom()">End session</button>
        </div>
        <!-- One button per session language: which caption boxes show here -->
        <div class="row toggle" id="display-toggle"></div>
    </div>
</details>

<div id="captions" style="display:none">
    <div class="cap-head">
        <div class="cap-label">Captions</div>
        <button class="size-btn" onclick="changeTextSize(-2)" aria-label="Smaller text">A−</button>
        <button class="size-btn" onclick="changeTextSize(2)" aria-label="Larger text">A+</button>
    </div>
    <!-- A labeled caption box per language being shown, built in subscribe() -->
    <div id="cap-boxes" style="flex:1;min-height:0;display:flex;flex-direction:column;gap:8px"></div>
</div>

<script src="https://appssdk.zoom.us/sdk.js"></script>
<script src="/captions.js"></script>
<script src="/languages.js"></script>
<script>
    // The SDK defines window.zoomSdk globally -- don't redeclare it.
    const sdk = window.zoomSdk;
    let sessionCode = null;
    let sessionLanguages = ['en'];   // the session's caption languages
    let shown = [];                  // which of them show in this panel
    let boxes = {};                  // lang -> { wrap, box, source }
    let lookTimer = null, audioTimer = null;
    let pendingSession = null;
    // Proves to the server which meeting this panel is in (see server.js).
    const PANEL_TOKEN = document.querySelector('meta[name="rt-panel-token"]').content;
    let captionsWereRunning = false;
    let textSize = 17;
    try { textSize = parseInt(localStorage.getItem('rt-panel-text-size'), 10) || 17; } catch (e) {}

    const $ = id => document.getElementById(id);

    // This Zoom user's saved settings (from /zoom/config).
    let config = { storeEnabled: false, configured: false, group: null };

    // Every call to our server carries the panel token.
    async function api(path, body) {
        const opts = { headers: { 'X-Panel-Token': PANEL_TOKEN } };
        if (body !== undefined) {
            opts.method = 'POST';
            opts.headers['Content-Type'] = 'application/json';
            opts.body = JSON.stringify(body);
        }
        const res = await fetch(path, opts);
        let data = {};
        try { data = await res.json(); } catch (e) {}
        return { ok: res.ok, status: res.status, data };
    }

    function setStatus(cls, text) {
        $('status').className = 'status ' + cls;
        $('status').textContent = text;
    }
    // Diagnostics go to the browser console only, not the panel.
    function log(msg) {
        console.log(`[Recovery Translator] ${msg}`);
    }

    // Opens one of our pages in the user's own browser. Zoom only lets the
    // panel open outside links through the SDK (openUrl).
    async function openDocs(path) {
        const url = location.origin + path;
        try { await sdk.openUrl({ url }); }
        catch (err) { setStatus('pending', 'See ' + url); }
    }

    // Text size for both caption boxes, remembered between meetings.
    function applyTextSize() {
        document.querySelectorAll('.cap-box').forEach(box => { box.style.fontSize = textSize + 'px'; });
    }
    function changeTextSize(delta) {
        textSize = Math.max(12, Math.min(40, textSize + delta));
        try { localStorage.setItem('rt-panel-text-size', textSize); } catch (e) {}
        applyTextSize();
    }

    async function init() {
        try {
            const cfg = await sdk.config({ capabilities: ['startRTMS', 'stopRTMS', 'sendMessageToChat', 'openUrl'], version: '0.16' });
            // Zoom lists any API not enabled for this app in the Marketplace settings.
            if (cfg.unsupportedApis && cfg.unsupportedApis.length) log('Not enabled for this app: ' + cfg.unsupportedApis.join(', '));
            log('Connected to Zoom. Context: ' + cfg.runningContext);
        } catch (err) {
            log('sdk.config() failed: ' + err.message);
            setStatus('err', 'This page runs inside a Zoom meeting. Open it from Apps → Recovery Translator.');
            return;
        }
        if (!PANEL_TOKEN) {
            log('No meeting context from Zoom');
            setStatus('err', 'Open Recovery Translator from Apps inside a meeting.');
            return;
        }
        applyTextSize();
        renderLanguagePicker($('lang-picker'));
        await loadConfig();
        // Remember the access code between meetings.
        try { $('access-code').value = localStorage.getItem('rt-access-code') || ''; } catch (e) {}

        const existing = await fetchCurrentSession();
        if (existing) showSession(existing);
        else showForm();
    }

    // ── Settings ──
    async function loadConfig() {
        try {
            const { ok, data } = await api('/zoom/config');
            if (ok) config = data;
        } catch (err) { log('Settings lookup failed: ' + err.message); }
        renderConfig();
    }

    // With a saved key, starting a session needs no access code.
    function renderConfig() {
        $('settings-btn').style.display = '';
        const saved = config.configured;
        $('access-code-row').style.display = saved ? 'none' : 'flex';
        $('key-note').style.display = saved ? '' : 'none';
        if (saved) $('key-note').textContent = `Using ${config.group.label}'s saved key (${config.group.keyHint}).`;
    }

    // Settings takes over the panel; Back restores whatever was showing.
    const MAIN_VIEWS = ['browser-session-banner', 'start-form', 'link-form', 'session-view', 'captions'];
    let hiddenViews = null;
    function openSettings() {
        if (!hiddenViews) hiddenViews = MAIN_VIEWS.map(id => [id, $(id).style.display]);
        MAIN_VIEWS.forEach(id => { $(id).style.display = 'none'; });
        $('settings-view').style.display = '';
        $('new-code').style.display = 'none';
        $('gemini-key').value = '';
        $('group-label').value = config.group ? config.group.label : '';
        $('settings-form').style.display = config.storeEnabled ? '' : 'none';
        $('remove-key-btn').style.display = config.group ? '' : 'none';
        $('settings-intro').textContent = !config.storeEnabled
            ? "This server isn't set up to save keys. Use an access code instead."
            : config.configured ? `Saved key: ${config.group.keyHint}. Paste a new key to replace it.` : '';
        $('settings-intro').style.display = $('settings-intro').textContent ? '' : 'none';
    }
    function closeSettings() {
        $('settings-view').style.display = 'none';
        if (hiddenViews) hiddenViews.forEach(([id, d]) => { $(id).style.display = d; });
        hiddenViews = null;
        renderConfig();
    }
    async function saveSettings() {
        const geminiKey = $('gemini-key').value.trim();
        if (!geminiKey) return;
        $('save-settings-btn').disabled = true;
        setStatus('pending', 'Checking the key with Google…');
        try {
            const { ok, data } = await api('/zoom/config', { geminiKey, label: $('group-label').value.trim() });
            if (!ok) { setStatus('err', data.error || 'Could not save the key.'); return; }
            config = { storeEnabled: true, configured: true, group: data.group };
            setStatus('ok', 'Key saved.');
            $('settings-intro').textContent = `Saved key: ${data.group.keyHint}. Paste a new key to replace it.`;
            $('settings-intro').style.display = '';
            $('remove-key-btn').style.display = '';
            // The website access code exists only now -- the server keeps a hash.
            if (data.accessCode) {
                const box = $('new-code');
                box.textContent = 'Website access code: ';
                const strong = document.createElement('strong');
                strong.textContent = data.accessCode;
                box.appendChild(strong);
                box.appendChild(document.createTextNode('. Write it down; it won\'t be shown again.'));
                box.style.display = '';
            }
        } catch (err) {
            setStatus('err', 'Could not save the key: ' + err.message);
        } finally {
            $('gemini-key').value = '';
            $('save-settings-btn').disabled = false;
        }
    }
    async function removeSettings() {
        if (!confirm('Remove your saved Gemini key and website access code?')) return;
        try {
            await api('/zoom/config/delete', {});
            config = { storeEnabled: config.storeEnabled, configured: false, group: null };
            setStatus('pending', 'Saved key removed.');
            closeSettings();
        } catch (err) {
            setStatus('err', 'Could not remove the key: ' + err.message);
        }
    }

    async function fetchCurrentSession() {
        try {
            const { data } = await api('/zoom/current-session');
            return data.sessionCode ? data : null;
        } catch (err) {
            log('Session lookup failed: ' + err.message);
            return null;
        }
    }

    // ── No session yet: show the form, and watch for one started in the browser ──
    function showForm() {
        sessionCode = null;
        unsubscribe();
        clearInterval(audioTimer);
        $('session-view').style.display = 'none';
        $('captions').style.display = 'none';
        $('start-form').style.display = '';
        $('link-form').style.display = '';
        $('create-btn').disabled = false;
        $('link-btn').disabled = false;
        setStatus('pending', 'No session yet.');
        clearInterval(lookTimer);
        lookTimer = setInterval(async () => {
            const s = await fetchCurrentSession();
            // Offer it rather than switching -- don't wipe out what's being typed.
            if (s && !sessionCode) {
                pendingSession = s;
                $('browser-session-text').textContent = `Session ${s.sessionCode} is running in this meeting.`;
                $('browser-session-banner').style.display = '';
            }
        }, 3000);
    }

    function useBrowserSession() {
        if (pendingSession) showSession(pendingSession);
    }

    async function linkBrowserSession() {
        const linkCode = $('link-code').value.trim();
        if (!linkCode) return;
        $('link-btn').disabled = true;
        try {
            const { ok, data } = await api('/zoom/link', { linkCode });
            if (!ok) {
                setStatus('err', data.error || 'Could not link that session.');
                $('link-btn').disabled = false;
                return;
            }
            log(`Linked session ${data.sessionCode} to this meeting`);
            $('link-code').value = '';
            showSession(data);
            if (!data.audioConnected) startCaptions();
        } catch (err) {
            setStatus('err', 'Could not link the session: ' + err.message);
            $('link-btn').disabled = false;
        }
    }

    async function createSessionFromZoom() {
        const accessCode = config.configured ? '' : $('access-code').value.trim();
        const choice = readLanguagePicker($('lang-picker'));
        if (!choice.languages.length) { setStatus('err', 'Pick at least one caption language.'); return; }
        if (!config.configured && !accessCode) {
            setStatus('err', 'Enter an access code, or save your Gemini key in Settings.');
            return;
        }
        $('create-btn').disabled = true;
        setStatus('pending', 'Starting session…');
        try {
            const body = { languages: choice.languages, audio: choice.audio, audioSource: 'zoom' };
            if (accessCode) body.accessCode = accessCode;
            const { ok, data } = await api('/session/create', body);
            if (!ok) {
                setStatus('err', data.error || 'Could not start the session.');
                $('create-btn').disabled = false;
                return;
            }
            if (accessCode) { try { localStorage.setItem('rt-access-code', accessCode); } catch (e) {} }
            log(`Session ${data.sessionCode} created (Zoom audio: ${data.zoomAudio})`);
            showSession({ sessionCode: data.sessionCode, languages: data.languages, audioConnected: data.zoomAudio === 'connected' });
            // Starting a session from Zoom means "caption this meeting now".
            if (data.zoomAudio !== 'connected') startCaptions();
        } catch (err) {
            setStatus('err', 'Could not start the session: ' + err.message);
            $('create-btn').disabled = false;
        }
    }

    // ── A session exists: captions and controls ──
    function showSession(data) {
        clearInterval(lookTimer);
        $('browser-session-banner').style.display = 'none';
        $('start-form').style.display = 'none';
        $('link-form').style.display = 'none';
        pendingSession = null;
        unsubscribe();
        sessionCode = data.sessionCode;
        sessionLanguages = data.languages && data.languages.length ? data.languages : ['en'];
        // Start with English if the session has it, else its first language.
        shown = [sessionLanguages.includes('en') ? 'en' : sessionLanguages[0]];
        buildLanguageToggles();
        log(`Session ${sessionCode} (${languageListText(sessionLanguages)})`);

        const joinUrl = `${location.origin}?join=${sessionCode}`;
        $('join-info').innerHTML = `Session <strong>${sessionCode}</strong> · listeners join at <a href="${joinUrl}" target="_blank">${joinUrl}</a>`;
        $('session-view').style.display = '';
        $('session-view').open = true;
        $('controls-summary').textContent = `Session ${sessionCode} · controls`;
        captionsWereRunning = false;
        $('captions').style.display = '';
        subscribe();
        setCaptionsRunning(!!data.audioConnected);
        watchAudio();
    }

    async function startCaptions() {
        $('start-btn').disabled = true;
        try {
            // Make sure the server is ready to connect this session to Zoom's audio.
            const { data } = await api('/zoom/connect', { sessionCode });
            log('Connect: ' + (data.status || data.error));
            if (data.status === 'no-session') {
                setStatus('err', 'That session has ended.');
                showForm();
                return;
            }
            try {
                const r = await sdk.startRTMS();
                log('startRTMS: ' + JSON.stringify(r));
            } catch (err) {
                // With RTMS auto-start on, the stream may already be running,
                // and the server has already claimed it. Not fatal.
                log('startRTMS: ' + err.message);
            }
            setStatus('pending', 'Connecting to Zoom audio…');
        } catch (err) {
            log('Start failed: ' + err.message);
            setStatus('err', 'Could not start captions: ' + err.message);
            $('start-btn').disabled = false;
        }
    }

    // Posts the join link to the meeting chat, as you. Text only -- Zoom's
    // chat API can't attach an image, so the QR code can't go in chat.
    async function postLinkToChat() {
        if (!sessionCode) return;
        const joinUrl = `${location.origin}?join=${sessionCode}`;
        // One line per session language, in that language.
        const message = sessionLanguages.map(l => `${LANGUAGES[l].chat}: ${joinUrl}`).join('\n');
        const btn = $('chat-link-btn');
        btn.disabled = true;
        try {
            await sdk.sendMessageToChat({ message });
            log('Posted join link to chat');
            btn.textContent = 'Posted to chat ✓';
            setTimeout(() => { btn.textContent = 'Post join link to meeting chat'; btn.disabled = false; }, 4000);
        } catch (err) {
            log('Post to chat failed: ' + err.message);
            setStatus('err', 'Could not post to chat. Check that sendMessageToChat is enabled for the app, and that meeting chat is on.');
            btn.disabled = false;
        }
    }

    async function stopCaptions() {
        // Tell the server this is a pause, so the session stays open.
        try {
            await api('/zoom/pause', { sessionCode });
        } catch (err) {
            log('Pause failed: ' + err.message);
        }
        try {
            const r = await sdk.stopRTMS();
            log('stopRTMS: ' + JSON.stringify(r));
        } catch (err) {
            log('stopRTMS failed: ' + err.message);
        }
    }

    async function endSessionFromZoom() {
        if (!sessionCode || !confirm(`End session ${sessionCode} for everyone?`)) return;
        try {
            await api('/zoom/end-session', { sessionCode });
            log(`Session ${sessionCode} ended`);
        } catch (err) {
            log('End failed: ' + err.message);
        }
        try { await sdk.stopRTMS(); } catch (e) { /* may already be stopped */ }
        showForm();
    }

    // Keeps the status and buttons in step with whether Zoom audio is flowing.
    function watchAudio() {
        clearInterval(audioTimer);
        audioTimer = setInterval(async () => {
            if (!sessionCode) return;
            try {
                const res = await fetch(`/zoom/session-status?code=${sessionCode}`);
                const data = await res.json();
                if (!data.exists) {
                    setStatus('err', 'This session has ended.');
                    showForm();
                    return;
                }
                setCaptionsRunning(data.audioConnected);
            } catch (e) { /* keep trying */ }
        }, 2000);
    }

    function setCaptionsRunning(running) {
        $('start-btn').disabled = running;
        $('stop-btn').disabled = !running;
        if (running) setStatus('ok', 'Captions live');
        else if (sessionCode) setStatus('pending', 'Paused — tap Start captions');
        // Give the captions the room once they're live; reopen to see controls.
        if (running && !captionsWereRunning) $('session-view').open = false;
        if (!running && captionsWereRunning) $('session-view').open = true;
        captionsWereRunning = running;
    }

    // One toggle per session language. At least one stays on.
    function buildLanguageToggles() {
        const row = $('display-toggle');
        row.innerHTML = '';
        sessionLanguages.forEach(lang => {
            const b = document.createElement('button');
            b.textContent = LANGUAGES[lang].native;
            b.className = shown.includes(lang) ? 'on' : '';
            b.onclick = () => toggleLanguage(lang);
            row.appendChild(b);
        });
        row.style.display = sessionLanguages.length > 1 ? '' : 'none';
    }

    function toggleLanguage(lang) {
        if (shown.includes(lang)) {
            if (shown.length === 1) return;
            shown = shown.filter(l => l !== lang);
        } else {
            shown = sessionLanguages.filter(l => shown.includes(l) || l === lang); // keep session order
        }
        buildLanguageToggles();
        subscribe();
    }

    // Boxes already showing keep their stream, so captions on screen are
    // never wiped when another language is added or removed.
    function subscribe() {
        if (!sessionCode) return;
        Object.keys(boxes).forEach(lang => {
            if (!shown.includes(lang)) { boxes[lang].source.close(); boxes[lang].wrap.remove(); delete boxes[lang]; }
        });
        const container = $('cap-boxes');
        shown.forEach(lang => {
            if (!boxes[lang]) boxes[lang] = attach(lang);
            container.appendChild(boxes[lang].wrap); // appendChild moves it, so this also orders them
        });
        applyTextSize();
    }

    function unsubscribe() {
        Object.values(boxes).forEach(b => { b.source.close(); b.wrap.remove(); });
        boxes = {};
    }

    function attach(lang) {
        const wrap = document.createElement('div');
        wrap.className = 'cap-wrap';
        const label = document.createElement('div');
        label.className = 'cap-label';
        label.textContent = LANGUAGES[lang].native;
        const box = document.createElement('div');
        box.className = 'cap-box';
        wrap.append(label, box);
        const source = attachCaptions(`/stream/${sessionCode}/${lang}`, box, {
            onEnded: () => box.appendChild(document.createTextNode('\n\n[Session ended]'))
        });
        return { wrap, box, source };
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
