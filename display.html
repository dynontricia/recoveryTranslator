<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
    <title>Recovery Translator — Display</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a; color: #e2e8f0; height: 100vh; overflow: hidden;
        }
        .layout { display: flex; height: 100vh; }

        /* Left 20%: QR + code */
        .col-qr {
            flex: 0 0 20%; background: #1e293b; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 24px; gap: 18px; text-align: center;
        }
        .col-qr h1 { font-size: 20px; font-weight: 700; color: #fff; }
        .col-qr .code { font-size: 40px; font-weight: 800; letter-spacing: 6px; color: #818cf8; }
        #qr-container img { border-radius: 10px; background: #fff; padding: 8px; }
        .col-qr .hint { font-size: 13px; color: #94a3b8; line-height: 1.5; }
        .col-qr .url { font-size: 12px; color: #64748b; word-break: break-all; }

        /* Two 40% caption columns */
        .col-cap { flex: 1 1 40%; display: flex; flex-direction: column; min-width: 0; }
        .cap-header {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: 12px 18px; background: #1e293b; border-bottom: 1px solid #334155;
        }
        .cap-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #94a3b8; margin-right: auto; }
        .cap-header select, .cap-header button {
            background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
            border-radius: 6px; padding: 5px 8px; font-size: 12px; cursor: pointer;
        }
        .cap-body {
            flex: 1; overflow-y: auto; padding: 28px 32px; font-size: 32px;
            line-height: 1.6; word-wrap: break-word; white-space: pre-wrap;
        }
        .col-es { border-left: 1px solid #334155; }

        .notice {
            display: none; margin: 24px 32px; padding: 24px; border-radius: 12px;
            background: #1e3a5f; border: 1.5px solid #3b82f6; color: #bfdbfe;
            font-size: 26px; font-weight: 700; text-align: center; line-height: 1.5;
        }
        .notice.active { display: block; }

        .controls-toggle {
            position: fixed; bottom: 12px; left: 12px; background: #1e293b;
            color: #94a3b8; border: 1px solid #334155; border-radius: 6px;
            padding: 6px 10px; font-size: 12px; cursor: pointer; z-index: 10;
        }
        .err { padding: 40px; font-size: 20px; color: #fca5a5; }
    </style>
</head>
<body>
<div class="layout" id="layout">
    <div class="col-qr">
        <h1>Recovery Translator</h1>
        <div class="code" id="code"></div>
        <div id="qr-container"></div>
        <div class="hint">Scan to join on your phone</div>
        <div class="url" id="url"></div>
    </div>

    <div class="col-cap col-en">
        <div class="cap-header">
            <span class="cap-title">English</span>
            <label style="font-size:11px;color:#64748b">Size
                <select data-ctl="size"><option>24</option><option>28</option><option selected>32</option><option>40</option><option>48</option><option>60</option></select>
            </label>
            <label style="font-size:11px;color:#64748b">Font
                <select data-ctl="font">
                    <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">System</option>
                    <option value="Georgia, serif">Serif</option>
                    <option value="'Courier New', monospace">Mono</option>
                    <option value="'Comic Sans MS', 'Comic Sans', cursive">Comic</option>
                </select>
            </label>
            <label style="font-size:11px;color:#64748b">Bg
                <select data-ctl="bg"><option value="#0f172a">Dark</option><option value="#ffffff">White</option><option value="#000000">Black</option><option value="#1a202c">Slate</option><option value="#fffbea">Cream</option></select>
            </label>
            <label style="font-size:11px;color:#64748b">Text
                <select data-ctl="fg"><option value="#e2e8f0">Light</option><option value="#000000">Black</option><option value="#ffffff">White</option><option value="#fbbf24">Amber</option></select>
            </label>
            <button onclick="popout('english')">Pop out ↗</button>
        </div>
        <div class="notice" id="notice-en"></div>
        <div class="cap-body" id="cap-en"></div>
    </div>

    <div class="col-cap col-es">
        <div class="cap-header">
            <span class="cap-title">Español</span>
            <button onclick="popout('spanish')">Abrir ventana ↗</button>
        </div>
        <div class="notice" id="notice-es">🔊 Un hispanohablante tiene la palabra. Por favor, escuche la sala.</div>
        <div class="cap-body" id="cap-es"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const code = (params.get('session') || '').toUpperCase();

    if (!code) {
        document.getElementById('layout').innerHTML =
            '<div class="err">No session code. Open this page from the leader screen, or add ?session=CODE to the URL.</div>';
    } else {
        document.getElementById('code').textContent = code;
        const joinUrl = `${location.origin}?join=${code}`;
        document.getElementById('url').textContent = joinUrl;
        new QRCode(document.getElementById('qr-container'), { text: joinUrl, width: 150, height: 150 });

        // Font/color controls (English column), applied to both caption bodies,
        // persisted locally so a room's preferred settings stick.
        const bodies = [document.getElementById('cap-en'), document.getElementById('cap-es')];
        const saved = JSON.parse(localStorage.getItem('rt-display-style') || '{}');
        function applyStyle() {
            bodies.forEach(b => {
                b.style.fontSize = (saved.size || 32) + 'px';
                b.style.fontFamily = saved.font || "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
                b.style.background = saved.bg || '#0f172a';
                b.style.color = saved.fg || '#e2e8f0';
            });
        }
        document.querySelectorAll('[data-ctl]').forEach(sel => {
            const key = sel.getAttribute('data-ctl');
            if (saved[key]) sel.value = saved[key];
            sel.addEventListener('change', () => {
                saved[key] = sel.value;
                localStorage.setItem('rt-display-style', JSON.stringify(saved));
                applyStyle();
            });
        });
        applyStyle();

        function subscribe(lang, boxId, noticeId, isSpanish) {
            const es = new EventSource(`/stream/${code}/${lang}`);
            es.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'session_ended') {
                    document.getElementById(boxId).innerText += '\n\n[Session ended]';
                    es.close(); return;
                }
                if (data.type === 'spanish_turn') {
                    // Spanish column holds captions + shows the notice; English
                    // column keeps flowing (it carries the live translation).
                    if (isSpanish) document.getElementById(noticeId).classList.toggle('active', data.active);
                    return;
                }
                if (!data.text) return;
                const b = document.getElementById(boxId);
                b.innerText += data.text; b.scrollTop = b.scrollHeight;
            };
        }
        subscribe('english', 'cap-en', 'notice-en', false);
        subscribe('spanish', 'cap-es', 'notice-es', true);
    }

    function popout(lang) {
        window.open(`/transcript?session=${code}&lang=${lang}`, '_blank',
            'width=700,height=900,menubar=no,toolbar=no,location=no');
    }
</script>
</body>
</html>
